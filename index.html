<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HBD 🥳</title>
<style>
  :root { --ink: #fdf6f0; --red: #e0262f; --red-dark: #a3121b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    overflow-x: hidden;
    background: linear-gradient(120deg, #2b2a63, #5b3a8c, #c0577f, #f2a07b, #4a7fb5, #2b2a63);
    background-size: 400% 400%;
    animation: flow 28s ease-in-out infinite;
  }
  @keyframes flow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* soft drifting color blobs */
  .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .45; pointer-events: none; }
  .b1 { width: 45vmax; height: 45vmax; background: #7fd1d9; top: -15vmax; left: -10vmax; animation: drift1 24s ease-in-out infinite alternate; }
  .b2 { width: 40vmax; height: 40vmax; background: #ffd0a1; bottom: -15vmax; right: -10vmax; animation: drift2 30s ease-in-out infinite alternate; }
  .b3 { width: 30vmax; height: 30vmax; background: #b99cf0; top: 35%; left: 45%; animation: drift3 26s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(25vw, 20vh) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-25vw, -15vh) scale(1.1); } }
  @keyframes drift3 { to { transform: translate(-20vw, 15vh) scale(.85); } }

  main {
    position: relative; z-index: 1;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4vh 1.25rem 6vh; gap: 2rem;
  }

  /* hidden until the gift is opened */
  main { opacity: 0; pointer-events: none; transition: opacity 1.2s ease .6s; }
  body.opened main { opacity: 1; pointer-events: auto; }

  /* gift screen */
  #gift {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2rem;
    background: none; border: 0; color: var(--ink); font: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .9s ease .6s, transform .9s ease .6s;
  }
  body.opened #gift { opacity: 0; transform: scale(1.25); pointer-events: none; }
  #gift p { font-size: clamp(1.05rem, 4vw, 1.3rem); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }

  .gift { position: relative; width: min(52vw, 220px); height: min(52vw, 220px); animation: giftbob 2.6s ease-in-out infinite; }
  @keyframes giftbob { 0%,100% { transform: translateY(0) rotate(-2.5deg); } 50% { transform: translateY(-12px) rotate(2.5deg); } }
  #gift:active .gift { animation-duration: .35s; }
  body.opened .gift { animation: none; }
  .gift .box {
    position: absolute; left: 7%; right: 7%; bottom: 0; height: 60%;
    background: linear-gradient(135deg, #ee343d, #a3121b);
    border-radius: 0 0 8px 8px; box-shadow: 0 18px 30px rgba(0,0,0,.3); overflow: hidden;
  }
  .gift .box::before, .lid::before { /* vertical ribbon */
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 17%;
    transform: translateX(-50%); background: linear-gradient(90deg, #f2c14e, #fff0b0, #f2c14e);
  }
  .gift .box::after { /* horizontal ribbon */
    content: ""; position: absolute; left: 0; right: 0; top: 40%; height: 14%;
    background: linear-gradient(180deg, #f2c14e, #fff0b0, #f2c14e);
  }
  .lid {
    position: absolute; left: 0; right: 0; bottom: 58%; height: 22%;
    background: linear-gradient(135deg, #f5434b, #b8161f);
    border-radius: 8px; box-shadow: 0 6px 12px rgba(0,0,0,.25);
    transform-origin: 0 100%; transition: transform .7s cubic-bezier(.3,1.5,.5,1);
  }
  body.opened .lid { transform: translate(-6px, -46px) rotate(-28deg); }
  .bow { position: absolute; left: 50%; bottom: 92%; width: 42%; height: 70%; transform: translateX(-50%); }
  .bow::before, .bow::after {
    content: ""; position: absolute; bottom: 0; width: 50%; height: 100%;
    border: 6px solid #f2c14e; background: rgba(255,240,176,.25);
  }
  .bow::before { left: 0; border-radius: 80% 80% 0 80%; transform: rotate(-12deg); }
  .bow::after  { right: 0; border-radius: 80% 80% 80% 0; transform: rotate(12deg); }
  .knot { position: absolute; left: 50%; bottom: 0; width: 26%; height: 36%; transform: translateX(-50%); background: #f2c14e; border-radius: 40%; z-index: 1; }

  /* draggable wrapper */
  .drag { touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; transform-origin: 50% 35%; will-change: transform; }
  .drag.grabbing { cursor: grabbing; }
  .drag.grabbing .balloon-wrap { animation-play-state: paused; }

  /* the big balloon */
  .balloon-wrap { animation: bob 6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-14px) rotate(1.5deg); } }
  .balloon {
    position: relative;
    width: min(62vw, 300px);
    aspect-ratio: 1.08;
    clip-path: url(#heart);
    background:
      radial-gradient(circle at 30% 22%, #ff7078 0%, var(--red) 40%, var(--red-dark) 100%);
    display: grid; place-items: center;
    padding-bottom: 10%;
  }
  .balloon-wrap { filter: drop-shadow(0 18px 24px rgba(0,0,0,.28)); }
  .balloon::before { /* highlight */
    content: ""; position: absolute; top: 14%; left: 16%;
    width: 14%; height: 16%; border-radius: 50%;
    background: rgba(255,255,255,.5); transform: rotate(-30deg); filter: blur(3px);
  }
  .string::before { /* knot */
    content: ""; position: absolute; top: -9px; left: 50%;
    width: 16px; height: 12px; background: var(--red-dark);
    transform: translateX(-50%); clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .balloon span {
    font-size: clamp(2.2rem, 9vw, 3.6rem);
    font-weight: 700; letter-spacing: .04em;
    text-shadow: 0 3px 8px rgba(0,0,0,.3);
    transform: rotate(-4deg);
  }
  .string { position: relative; width: 2px; height: 90px; margin: 4px auto 0; background: rgba(255,255,255,.7); border-radius: 2px; }

  /* speech */
  .speech {
    max-width: 34rem;
    padding: 1.5rem 1.75rem;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 1.25rem;
    backdrop-filter: blur(8px);
    font-size: clamp(1.05rem, 3.6vw, 1.25rem);
    line-height: 1.75;
    min-height: 11rem;
    text-align: left;
  }
  .speech .cursor { display: inline-block; width: 2px; height: 1.1em; background: var(--ink); margin-left: 2px; vertical-align: -.15em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .hint { font-size: .9rem; opacity: .85; transition: opacity .6s; text-align: center; }
  .hint.hide { opacity: 0; pointer-events: none; }

  /* floating mini balloons */
  .mini { position: fixed; bottom: -80px; width: 38px; height: 35px; clip-path: url(#heart);
    background: radial-gradient(circle at 30% 25%, #ff8a90, var(--red)); opacity: .55; z-index: 0; pointer-events: none;
    animation: rise linear infinite; }
  @keyframes rise { to { transform: translateY(-120vh) translateX(var(--sway)); } }

  @media (prefers-reduced-motion: reduce) {
    body, .blob, .balloon-wrap, .mini { animation: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="heart" clipPathUnits="objectBoundingBox">
      <path d="M0.5,1 C0.2,0.78 0,0.55 0,0.3 C0,0.12 0.13,0 0.28,0 C0.38,0 0.46,0.06 0.5,0.15 C0.54,0.06 0.62,0 0.72,0 C0.87,0 1,0.12 1,0.3 C1,0.55 0.8,0.78 0.5,1 Z"/>
    </clipPath>
  </defs>
</svg>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<button id="gift" aria-label="Open your gift">
  <div class="gift">
    <div class="box"></div>
    <div class="lid"><div class="bow"><i class="knot"></i></div></div>
  </div>
  <p>A small gift for my beautiful girlfriend 🎁</p>
</button>

<main>
  <div class="drag" id="drag">
    <div class="balloon-wrap">
      <div class="balloon"><span>HBD❤️</span></div>
      <div class="string"></div>
    </div>
  </div>
  <p class="speech" id="speech" aria-live="polite"><span class="cursor"></span></p>
</main>

<script>
/* ====== EDIT YOUR SPEECH HERE ====== */
const speech =
  "رۆژی لەدایکبوونت پیرۆزبێ تاقانەکەمممم😍🥳،  ئەمرۆ رۆژەکی زۆر زۆر تایبەتە نازدارەکەم پێش ٢٠ ساڵ هاتە ئەم دونیایە و ئەمرۆ گەورە بوو وە گەیشتە ساڵی بیستەکانی تەمەنی🥹🫶🏻، کەوا لە هەموو کاتەکانی ژیانی بەس هەوڵی داوە و بەرەو باشتر وباشتر و کۆڵی نەداوە🥹🥹 ، " +
  "پڕ بە دڵ هیوادارم تەمەنەکی پر لە خێر و خۆشی بێتە پێشت کەوا هەموو کاتەک تێیدا دڵ خۆش و دەم بە خەندە ببی و سەرکەوتووبی لە ژیانت وە هەر هیوایەک لەناو دڵە بچووکەکەت هەیە ئینشاللە دێتە دی🥹🤲🏻 و " +
  "  پڕ بە دڵ بە هیوام هەموو کات ساغ و سەلامەت بی لۆمان بمێنی تاقانەکەمممممممممممم شازادە نازدارەکەمممممممممممممممم 😍😍😍❤️❤️❤️                    "+
  "                    "+
  
  "  زۆر زۆر زۆرمممم خۆش دەوێیییییییی😍❤️ ";

/* ====== TYPEWRITER SPEECH ====== */
const el = document.getElementById('speech');
let i = 0;
function startTyping() {
  if (i <= speech.length) {
    el.innerHTML = speech.slice(0, i) + '<span class="cursor"></span>';
    i++;
    setTimeout(startTyping, 55);
  } else {
    el.textContent = speech;
  }
}

/* ====== MUSIC (generated with Web Audio, no files needed) ====== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const ctx = new AudioCtx();
const master = ctx.createGain();
master.gain.value = 0.18;
master.connect(ctx.destination);

const N = { C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392, A4:440, Bb4:466.16, C5:523.25 };
// "Happy Birthday" melody: [note, beats]
const tune = [
  ['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
  ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
  ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
  ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]
];
Object.assign(N, { B4:493.88, D5:587.33, E5:659.25, F5:698.46, G5:783.99 });

const beat = 0.55; // seconds per beat (slow, calm)
function playNote(freq, t, dur) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(1, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function playLoop() {
  let t = ctx.currentTime + 0.1;
  tune.forEach(([n, b]) => { playNote(N[n], t, b * beat * 1.4); t += b * beat; });
  setTimeout(playLoop, (t - ctx.currentTime + 1.5) * 1000); // pause, then repeat
}

/* ====== YOUR OWN SONG ======
   Put your song in the same folder as this file and write its name here,
   e.g. const SONG = "song.mp3";   Leave it "" to use the built-in melody. */
const SONG = "Love.m4a";

let started = false;
function startMusic() {
  if (started) return;
  started = true;
  if (SONG) {
    const audio = new Audio(SONG);
    audio.loop = true;
    audio.volume = 0.8;
    audio.play().catch(() => { started = false; });
  } else {
    ctx.resume().then(playLoop);
  }
}

/* ====== OPEN THE GIFT: starts music + speech ====== */
document.getElementById('gift').addEventListener('click', () => {
  if (document.body.classList.contains('opened')) return;
  document.body.classList.add('opened');
  startMusic();
  setTimeout(startTyping, 1100);
});

/* ====== DRAG THE BALLOON (touch + mouse) ====== */
const drag = document.getElementById('drag');
let x = 0, y = 0, vx = 0, vy = 0, dragging = false, sx = 0, sy = 0, lx = 0, ly = 0, lt = 0, rafId = 0;

function render() {
  const tilt = Math.max(-25, Math.min(25, vx * 1.2));
  drag.style.transform = `translate(${x}px, ${y}px) rotate(${tilt}deg)`;
}
function spring() {
  // rubber-band back to the resting spot after release
  vx += (-0.08 * x - 0.06 * vx * 6) * 0.6;
  vy += (-0.08 * y - 0.06 * vy * 6) * 0.6;
  x += vx; y += vy;
  vx *= 0.9; vy *= 0.9;
  render();
  if (Math.abs(x) + Math.abs(y) + Math.abs(vx) + Math.abs(vy) > 0.2) {
    rafId = requestAnimationFrame(spring);
  } else {
    x = y = vx = vy = 0; render();
  }
}
drag.addEventListener('pointerdown', e => {
  dragging = true;
  cancelAnimationFrame(rafId);
  drag.setPointerCapture(e.pointerId);
  drag.classList.add('grabbing');
  sx = e.clientX - x; sy = e.clientY - y;
  lx = e.clientX; ly = e.clientY; lt = performance.now();
});
drag.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = performance.now(), dt = Math.max(now - lt, 1);
  vx = (e.clientX - lx) / dt * 16;
  vy = (e.clientY - ly) / dt * 16;
  lx = e.clientX; ly = e.clientY; lt = now;
  x = e.clientX - sx; y = e.clientY - sy;
  render();
});
function release() {
  if (!dragging) return;
  dragging = false;
  drag.classList.remove('grabbing');
  rafId = requestAnimationFrame(spring);
}
drag.addEventListener('pointerup', release);
drag.addEventListener('pointercancel', release);

/* ====== floating mini balloons ====== */
for (let k = 0; k < 10; k++) {
  const m = document.createElement('div');
  m.className = 'mini';
  m.style.left = Math.random() * 100 + 'vw';
  m.style.animationDuration = 16 + Math.random() * 14 + 's';
  m.style.animationDelay = -Math.random() * 20 + 's';
  m.style.setProperty('--sway', (Math.random() * 80 - 40) + 'px');
  m.style.transform = 'scale(' + (0.6 + Math.random() * 0.9) + ')';
  document.body.appendChild(m);
}
</script>
</body>
</html>
